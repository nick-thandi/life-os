<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Life OS · Today</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="top">
    <h1 id="date">Today</h1>
    <div class="clock" id="clock">--:--</div>
    <div class="status"><span id="status">Loading…</span><button id="signout" hidden>Sign out</button></div>
  </header>

  <div class="view-switch" id="view-switch" hidden role="group" aria-label="View"><button data-view="me">Me</button><button data-view="family">Family</button></div>
  <nav class="day-strip" id="day-strip" aria-label="Days"></nav>

  <section class="now-banner" id="now-banner" hidden></section>

  <section class="gate" id="gate" hidden>
    <h2>Life OS</h2>
    <p id="gate-message">Sign in with Google (your own account on your phone, the family account on the TV) to see today.</p>
    <button id="signin">Sign in with Google</button>
  </section>

  <main class="board" id="board"></main>

  <nav class="bottom-nav" aria-label="Life OS"><a class="active" href="index.html" aria-current="page">Today</a><a href="intray.html">In-tray</a><a href="activity.html">Activity</a></nav>

  <script src="config.js"></script>
  <script src="data/calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
